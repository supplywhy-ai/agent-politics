name: Public artifact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-plot.txt
      - run: python -m unittest discover -s outputs/agent-politics-research/tests
      - run: python scripts/reproduce_figures.py
